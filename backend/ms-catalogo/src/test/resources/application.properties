spring.application.name=ms-catalogo-test
spring.datasource.url=jdbc:h2:mem:catalogo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null

# JUnit usa H2 y Hibernate create-drop, no Flyway.
spring.flyway.enabled=false

# Provee JavaMailSender en pruebas sin enviar correo real.
spring.mail.host=localhost
spring.mail.port=3025
luxury.mail.enabled=false

