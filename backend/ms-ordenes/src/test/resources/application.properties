spring.application.name=ms-ordenes-test
spring.datasource.url=jdbc:h2:mem:ordenes;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null

# JUnit usa H2 y Hibernate create-drop, no Flyway.
spring.flyway.enabled=false

# Crea el bean JavaMailSender en tests (no se envía nada real: luxury.mail.enabled es false)
spring.mail.host=localhost
spring.mail.port=3025
luxury.mail.enabled=false
